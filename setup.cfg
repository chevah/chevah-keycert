[metadata]
name = chevah-keycert
version = 3.3.0
maintainer = Adi Roiban
maintainer_email = adi.roiban@proatria.com
license = MIT
platforms = any
description = SSH Keys and SSL keys and certificates management.
long_description = file: README.rst
url = 'https://github.com/chevah/chevah-keycert'

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[options]
install_requires =
    pyopenssl == 26.4.0
    cryptography == 50.0.0
    pyasn1 >= 0.6.4
    constantly >= 23.10.0
    bcrypt >= 5
    setuptools

packages = find:
package_dir = =src

[options.packages.find]
where = src


[options.extras_require]
; These are the deps required to develop.
; Try to pin them as much as possible.
dev =
    zope.interface
    wheel

    ruff~=0.16.0
    psutil


    chevah-compat >= 1.7.1

    pynose>=1.5.4
    mock
    bunch
    coverage==7.11.3
    codecov
    unidecode
    distro
